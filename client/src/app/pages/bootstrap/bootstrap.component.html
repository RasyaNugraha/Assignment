<div class="screen">
  <form class="card" (ngSubmit)="onSubmit()">
    <div class="bubbles">
      <span class="bubble bubble--blue"></span>
      <span class="bubble bubble--yellow"></span>
      <span class="bubble bubble--coral"></span>
    </div>

    <h1 class="wordmark">Fabulari</h1>
    <p class="tagline">where communities meet</p>
    <h2 class="title">Set up the first Super Admin account</h2>
    <p class="hint">This only appears once — no accounts exist yet on this server.</p>

    @if (errorMessage()) {
      <p class="error">{{ errorMessage() }}</p>
    }

    <div class="field-row">
      <label class="field">
        <span class="field__label">First Name</span>
        <input class="field__input" type="text" name="firstName" [(ngModel)]="firstName" placeholder="Jane" required />
      </label>
      <label class="field">
        <span class="field__label">Last Name</span>
        <input class="field__input" type="text" name="lastName" [(ngModel)]="lastName" placeholder="Doe" required />
      </label>
    </div>

    <label class="field">
      <span class="field__label">Email</span>
      <input class="field__input" type="email" name="email" [(ngModel)]="email" placeholder="you@example.com" required />
    </label>

    <label class="field">
      <span class="field__label">Date of Birth</span>
      <input class="field__input" type="date" name="dateOfBirth" [(ngModel)]="dateOfBirth" required />
    </label>

    <label class="field">
      <span class="field__label">Password</span>
      <input
        class="field__input"
        type="password"
        name="password"
        [(ngModel)]="password"
        placeholder="min. 8 chars, 1 uppercase"
        required
      />
    </label>

    <label class="field">
      <span class="field__label">Confirm Password</span>
      <input
        class="field__input"
        type="password"
        name="confirmPassword"
        [(ngModel)]="confirmPassword"
        placeholder="••••••••"
        required
      />
    </label>

    <button class="btn btn--blue" type="submit" [disabled]="loading()">
      {{ loading() ? 'Setting up…' : 'Create Super Admin' }}
    </button>
  </form>
</div>
